plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.20'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.pfilaretov42'
version = '0.0.1-SNAPSHOT'
description = 'spring-mapstruct-test'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // Target the highest supported bytecode level supported by Kotlin 2.2.20 (24 as of now)
    sourceCompatibility = JavaVersion.VERSION_24
    targetCompatibility = JavaVersion.VERSION_24
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.20')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    // Use JDK 25 toolchain for Kotlin compiler while targeting the highest supported JVM bytecode
    jvmToolchain(25)
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict'
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_24
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
